<style>
/* Layout: una sola columna de teléfono, una pantalla por vez, centrada en pantallas grandes. */
:root {

}
@media (prefers-color-scheme: dark) {

    --fg: #F1EAE5;
    --muted: #B3A79F;
    --line: #3A3330;
    --line-strong: #5A4F4A;
    --accent: #D9707A;
    --accent-ink: #1D1917;
    --soft: #4A2A2F;
    --soft-ink: #F2C4C8;
    --warn: #4A3A1C;
    --warn-ink: #F0D49A;
    --neutral: #38302C;
    --neutral-ink: #D6CBC4;
    --danger: #F08A90;
    --overlay: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1917;
  --surface: #27221F;
  --fg: #F1EAE5;
  --muted: #B3A79F;
  --line: #3A3330;
  --line-strong: #5A4F4A;
  --accent: #D9707A;
  --accent-ink: #1D1917;
  --soft: #4A2A2F;
  --soft-ink: #F2C4C8;
  --warn: #4A3A1C;
  --warn-ink: #F0D49A;

}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); padding-inline: 16px; padding-block: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2 { margin: 0; text-wrap: balance; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 430px; margin: 0 auto; padding-bottom: 96px; }
.bar { display: flex; align-items: center; gap: 8px; min-height: 56px; border-bottom: 1px solid var(--line); }
.bar h1 { font: 600 22px/1.2 var(--serif); }
.bar.sub h1 { font: 600 16px/1.2 var(--sans); }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; background: none; border: 0; border-radius: 10px; color: var(--fg); }
.stack { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }

.search { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; color: var(--muted); text-align: left; }
.row { display: flex; gap: 10px; align-items: center; }

.seg button { flex: 1; min-height: 44px; border: 0; background: transparent; color: var(--neutral-ink); font-weight: 500; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; }
.filtrar { min-height: 44px; padding: 0 14px; }

.btn-danger { background: transparent; color: var(--danger); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; }
.count { margin: 0; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

.link { background: none; border: 0; padding: 4px 2px; min-height: 32px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

.card-name { min-width: 0; font-weight: 600; font-size: 16px; }

.card-foot { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 14px; }

.card mark { background: var(--soft); color: var(--soft-ink); border-radius: 3px; padding: 0 2px; }
.pill { flex: none; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.soft { background: var(--soft); color: var(--soft-ink); }
.pill.warn { background: var(--warn); color: var(--warn-ink); }
.pill.neutral { background: var(--neutral); color: var(--neutral-ink); }

.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 16px; text-align: center; }
.empty h2 { font: 600 24px/1.2 var(--serif); }
.empty p { margin: 0; color: var(--neutral-ink); }
.empty-ic { width: 80px; height: 80px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--soft-ink); }
.hint { margin: 0; color: var(--muted); }
.foot-note { margin-top: 24px; font-size: 13px; color: var(--muted); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 44px; width: 100%; min-width: 0; padding: 0 12px; background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 10px; font: inherit; }

.intro { margin: 0; color: var(--neutral-ink); }
.actions { display: flex; gap: 12px; padding-top: 8px; }
.actions .btn { flex: 1; }
.actions .btn-primary { flex: 2; }

.detail-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-top: 8px; }
.detail-head h2 { font: 600 30px/1.15 var(--serif); }
.detail-head p { margin: 0; color: var(--neutral-ink); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv span { min-width: 0; }
.kv span:first-child { color: var(--muted); flex: none; }
.kv span:last-child { text-align: right; overflow-wrap: anywhere; }
.kv.act { gap: 12px; }
.kv.act span:first-child { color: var(--fg); flex: 1; }
.kv.act span:last-child { color: var(--muted); flex: none; }
.buttons { display: flex; flex-direction: column; gap: 10px; padding-block: 8px 8px; }

dialog { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 18px; width: min(360px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--overlay); }
dialog h2 { font: 600 22px/1.2 var(--serif); margin-bottom: 8px; }
dialog p { margin: 0 0 18px; color: var(--neutral-ink); }
.dlg-btns { display: flex; gap: 10px; }
.dlg-btns .btn { flex: 1; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 398px; margin: 0 auto; padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 500; text-align: center; }
[hidden] { display: none !important; }
</style>

    var f = S.filtros;
    return bar('Filtrar retiros', true) + '<main class="stack"><p class="intro">Elegí uno o más atributos para acotar tu lista de retiros registrados.</p>' +
      '<div class="fields"><div class="field"><label for="f-desde">Desde</label><input id="f-desde" type="date" value="' + esc(f.desde) + '"></div><div class="field"><label for="f-hasta">Hasta</label><input id="f-hasta" type="date" value="' + esc(f.hasta) + '"></div></div>' +
      '<div class="field"><label for="f-ubicacion">Ubicación</label><input id="f-ubicacion" placeholder="Ciudad, provincia o país" value="' + esc(f.ubicacion) + '"></div>' +
      '<div class="field"><label for="f-genero">Género del grupo</label><select id="f-genero">' + opts(['Todos', 'Hombres', 'Mujeres', 'Mixto'], f.genero) + '</select></div>' +
      '<div class="field"><label for="f-precio">Precio máximo</label><input id="f-precio" type="number" inputmode="numeric" min="0" step="1000" placeholder="$" value="' + esc(f.precio) + '"></div>' +
      '<div class="fields"><div class="field"><label for="f-privacidad">Nivel de privacidad</label><select id="f-privacidad">' + opts(['Todos', 'Bajo', 'Medio', 'Alto'], f.privacidad) + '</select></div><div class="field"><label for="f-estado">Estado</label><select id="f-estado">' + opts(ESTADOS, f.estado) + '</select></div></div>' +
      '<div class="actions"><button type="button" class="btn" data-a="limpiar">Limpiar</button><button type="button" class="btn btn-primary" data-a="aplicar">Aplicar filtros</button></div></main>';
  }

  function vBusqueda() {
    return bar('Buscar retiro', true) + '<main class="stack"><div class="field"><label for="q">Nombre del retiro</label><input id="q" class="big" type="search" autocomplete="off" value="' + esc(S.q) + '"></div><div id="res" class="stack" style="padding-top:0" aria-live="polite"></div></main>';
  }
  function renderResultados() {
    var el = $('#res'); if (!el) return;
    var q = norm(S.q.trim());
    if (!q) { el.innerHTML = '<p class="hint">Escribí el nombre de un retiro registrado.</p>'; return; }
    var r = S.data.filter(function (x) { return norm(x.nombre).indexOf(q) !== -1; });
    if (!r.length) { el.innerHTML = '<div class="empty"><h2>Sin resultados</h2><p>No hay ningún retiro registrado con ese nombre. Revisá cómo lo escribiste.</p></div>'; return; }
    el.innerHTML = '<p class="count">' + r.length + (r.length > 1 ? ' retiros encontrados' : ' retiro encontrado') + '</p>' + r.map(function (x) { return card(x, q); }).join('');
  }

  function kv(k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; }
  function vDetalle() {
    var r = S.data.filter(function (x) { return x.id === S.sel; })[0];
    if (!r) { S.screen = 'lista'; return vLista(); }
    var acts = r.actividades.slice().sort(function (a, b) { return a.desde.localeCompare(b.desde); }).map(function (a) {
      return '<div class="kv act"><span>' + esc(a.nombre) + '</span><span>' + dm(a.desde) + ' ' + hm(a.desde) + '–' + hm(a.hasta) + '</span></div>';
    }).join('');
    var contacto = r.contacto.split(' · ').map(esc).join('<br>');
    return bar('Mis retiros', true) + '<main class="stack">' +
      '<div class="detail-head">' + pill(r.estado) + '<h2>' + esc(r.nombre) + '</h2><p>' + esc(r.descripcion) + '</p></div>' +
      '<section class="sec"><h3>Datos generales</h3><div class="box">' + kv('Inicio', dmy(r.inicio) + ' ' + hm(r.inicio)) + kv('Fin', dmy(r.fin) + ' ' + hm(r.fin)) + kv('Género del grupo', esc(r.genero)) + kv('Tamaño del grupo', r.grupo + ' personas') + kv('Precio', money(r.precio)) + kv('Servicios', esc(r.servicios)) + kv('Cancelación', esc(r.cancelacion)) + kv('Mascotas', r.mascotas ? 'Se aceptan' : 'No se aceptan') + '</div></section>' +
      '<section class="sec"><h3>Ubicación</h3><div class="box">' + kv('País', esc(r.pais)) + kv('Provincia', esc(r.provincia)) + kv('Ciudad', esc(r.ciudad)) + kv('Departamento', esc(r.departamento)) + kv('Dirección', esc(r.direccion)) + '</div></section>' +
      '<section class="sec"><h3>Organizador</h3><div class="box">' + kv('Contacto', contacto) + '</div></section>' +
      '<section class="sec"><h3>Cronograma (' + r.actividades.length + (r.actividades.length === 1 ? ' actividad' : ' actividades') + ')</h3><div class="box">' + (acts || '<div class="kv"><span>Sin actividades cargadas</span></div>') + '</div></section>' +
      '<section class="sec"><h3>Mis notas</h3><div class="box">' + kv('Objetivos', esc(r.objetivos)) + kv('Comentario', esc(r.comentario)) + kv('Puntuación', r.puntuacion == null ? 'Sin puntuar' : r.puntuacion + ' de 5') + kv('Privacidad', esc(r.privacidad)) + '</div></section>' +
      '<div class="buttons"><button type="button" class="btn btn-primary" data-a="modificar">Modificar retiro</button><button type="button" class="btn btn-ghost" data-a="toggle-baja">' + (r.estado === 'Inactivo' ? 'Dar de alta' : 'Dar de baja') + '</button><button type="button" class="btn btn-danger" data-a="eliminar">Eliminar retiro</button></div></main>';
  }

  var VIEWS = { lista: vLista, filtros: vFiltros, busqueda: vBusqueda, detalle: vDetalle };
  function render() {
    $('#app').innerHTML = VIEWS[S.screen]();
    if (S.screen === 'busqueda') renderResultados();
  }
  function go(screen) {
    S.screen = screen; render(); window.scrollTo(0, 0);
    var t = S.screen === 'busqueda' ? $('#q') : $('#app h1');
    if (t) t.focus({ preventScroll: true });
  }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function ask(o) {
    $('#dlg-t').textContent = o.titulo; $('#dlg-p').textContent = o.texto;
    var ok = $('#dlg-ok'); ok.textContent = o.ok; ok.className = 'btn ' + (o.danger ? 'btn-danger' : 'btn-primary');
    $('#dlg-no').hidden = !!o.sinCancelar;
    S.pending = o.fn || null;
    $('#dlg').showModal();
  }
  function selRetiro() { return S.data.filter(function (x) { return x.id === S.sel; })[0]; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a;
    if (a === 'ir-busqueda') { go('busqueda'); }
    else if (a === 'ir-filtros') { go('filtros'); }
    else if (a === 'volver') { go(S.screen === 'detalle' ? S.prev : 'lista'); }
    else if (a === 'abrir') { S.prev = S.screen; S.sel = Number(b.dataset.id); go('detalle'); }
    else if (a === 'orden') {
      if (b.dataset.v === 'aleatorio') S.seq = shuffle(S.seq);
      S.orden = b.dataset.v; render();
      var nb = document.querySelector('[data-a="orden"][data-v="' + b.dataset.v + '"]'); if (nb) nb.focus();
    }
    else if (a === 'aplicar') {
      S.filtros = { desde: $('#f-desde').value, hasta: $('#f-hasta').value, ubicacion: $('#f-ubicacion').value, genero: $('#f-genero').value, precio: $('#f-precio').value, privacidad: $('#f-privacidad').value, estado: $('#f-estado').value };
      go('lista');
    }
    else if (a === 'limpiar') { S.filtros = Object.assign({}, DEF); render(); }
    else if (a === 'quitar-filtros') { S.filtros = Object.assign({}, DEF); render(); toast('Filtros quitados'); }
    else if (a === 'modificar') {
      ask({ titulo: 'Modificar retiro', texto: 'Este botón abre el caso de uso Modificar retiro, que tiene su propio prototipo.', ok: 'Entendido', sinCancelar: true });
    }
    else if (a === 'toggle-baja') {
      var r = selRetiro(); if (!r) return;
      var baja = r.estado !== 'Inactivo';
      r.estado = baja ? 'Inactivo' : 'Activo'; render();
      toast(baja ? 'Retiro dado de baja' : 'Retiro dado de alta');
    }
    else if (a === 'eliminar') {
      var d = selRetiro(); if (!d) return;
      ask({ titulo: '¿Eliminar este retiro?', texto: 'Vas a eliminar «' + d.nombre + '». Esta acción no se puede deshacer.', ok: 'Eliminar', danger: true, fn: function () {
        S.data = S.data.filter(function (x) { return x.id !== d.id; });
        S.seq = S.seq.filter(function (id) { return id !== d.id; });
        S.sel = null; go('lista'); toast('Retiro eliminado');
      } });
    }
    else if (a === 'reiniciar') { reset(); render(); window.scrollTo(0, 0); toast('Se restauraron los retiros de ejemplo'); }
    else if (a === 'dlg-ok') { var fn = S.pending; S.pending = null; $('#dlg').close(); if (fn) fn(); }
    else if (a === 'dlg-no') { S.pending = null; $('#dlg').close(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') { S.q = e.target.value; renderResultados(); }
  });

  reset(); render();
})();
</script>
</body></html>
